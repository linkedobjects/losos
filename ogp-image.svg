<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafaf8"/>
      <stop offset="100%" style="stop-color:#f0efeb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative chain visualization -->
  <g transform="translate(600, 280)" fill="none" stroke="#e5e3de" stroke-width="2">
    <circle cx="-300" cy="0" r="30"/>
    <circle cx="-150" cy="0" r="30"/>
    <circle cx="0" cy="0" r="30"/>
    <circle cx="150" cy="0" r="30"/>
    <circle cx="300" cy="0" r="30"/>
    <line x1="-270" y1="0" x2="-180" y2="0"/>
    <line x1="-120" y1="0" x2="-30" y2="0"/>
    <line x1="30" y1="0" x2="120" y2="0"/>
    <line x1="180" y1="0" x2="270" y2="0"/>
  </g>

  <!-- Highlight nodes -->
  <g transform="translate(600, 280)">
    <circle cx="-300" cy="0" r="25" fill="#7b3f9e" opacity="0.15"/>
    <circle cx="0" cy="0" r="25" fill="#1a5276" opacity="0.15"/>
    <circle cx="300" cy="0" r="25" fill="#7b3f9e" opacity="0.15"/>
  </g>

  <!-- Title -->
  <text x="600" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="72" fill="#2c2c2c">LOSOS</text>

  <!-- Subtitle -->
  <text x="600" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#666" font-style="italic">Linked Object Shell / Operating System</text>

  <!-- Badge -->
  <text x="600" y="540" text-anchor="middle" font-family="Courier New, monospace" font-size="18" fill="#888">5.9 KB gzipped · no build step · no dependencies</text>

  <!-- Link icon -->
  <text x="600" y="120" text-anchor="middle" font-size="80">🔗</text>
</svg>
